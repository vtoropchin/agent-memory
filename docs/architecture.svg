<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 740" width="1040" height="740" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#1f2328" flood-opacity="0.14"/>
    </filter>
    <marker id="aSlate" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#475569"/></marker>
    <marker id="aSlateStart" markerWidth="9" markerHeight="9" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#475569"/></marker>
    <marker id="aPurple" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/></marker>
    <marker id="aTeal" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0d9488"/></marker>
    <marker id="aCyan" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0891b2"/></marker>
  </defs>

  <rect x="8" y="6" width="1024" height="728" rx="10" fill="#ffffff" stroke="#d0d7de"/>

  <text x="520" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2328">AgentMemory — архитектура</text>
  <text x="520" y="60" text-anchor="middle" font-size="12" fill="#656d76">Один доменный слой поверх SQLite · три поверхности доступа · два опциональных AI-слоя</text>

  <!-- consumers -->
  <rect x="40" y="74" width="300" height="44" rx="8" fill="#dbeafe" stroke="#3b82f6" filter="url(#sh)"/>
  <text x="190" y="91" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">Агент · MCP-клиент</text>
  <text x="190" y="107" text-anchor="middle" font-size="11" fill="#1e3a8a">другая сессия / другой агент</text>

  <rect x="372" y="74" width="300" height="44" rx="8" fill="#e5e7eb" stroke="#6b7280" filter="url(#sh)"/>
  <text x="522" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">Терминал · скрипты · хуки харнесса</text>

  <rect x="704" y="74" width="300" height="44" rx="8" fill="#e0e7ff" stroke="#6366f1" filter="url(#sh)"/>
  <text x="854" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#3730a3">Человек · браузер (127.0.0.1)</text>

  <!-- container A -->
  <rect x="28" y="134" width="988" height="100" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="42" y="151" font-size="11" font-style="italic" fill="#64748b">memoryd — один бинарь · три поверхности доступа</text>

  <rect x="40" y="164" width="300" height="60" rx="8" fill="#f3e8ff" stroke="#a855f7" filter="url(#sh)"/>
  <text x="52" y="184" font-size="11" fill="#6b21a8">internal/mcp — MCP over stdio<tspan x="52" dy="15">save · recall · update · forget</tspan><tspan x="52" dy="15">типизир. links · ttl · explain · фильтры</tspan></text>

  <rect x="372" y="164" width="300" height="60" rx="8" fill="#e2e8f0" stroke="#475569" filter="url(#sh)"/>
  <text x="384" y="184" font-size="11" fill="#334155">CLI — memoryd<tspan x="384" dy="15">recall · save · hook (ambient)</tspan><tspan x="384" dy="15">doctor · export · import</tspan></text>

  <rect x="704" y="164" width="300" height="60" rx="8" fill="#e0f2fe" stroke="#0284c7" filter="url(#sh)"/>
  <text x="716" y="184" font-size="11" fill="#075985">Web — memoryd web (127.0.0.1)<tspan x="716" dy="15">HTTP API + фронтенд · поиск (лексика + смысл)</tspan><tspan x="716" dy="15">карточка · PATCH метаданных · forget</tspan></text>

  <!-- container B -->
  <rect x="28" y="262" width="988" height="222" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="42" y="279" font-size="11" font-style="italic" fill="#64748b">Доменная логика · internal/memory · всё за интерфейсами</text>

  <rect x="44" y="292" width="300" height="180" rx="8" fill="#dcfce7" stroke="#22c55e" filter="url(#sh)"/>
  <text x="56" y="314" font-size="11.5" font-weight="bold" fill="#14532d">Writer · write — запись</text>
  <text x="56" y="344" font-size="11" fill="#14532d">• приём: kind · content · importance · tags · scope<tspan x="56" dy="16">• дедуп в scope: FTS5 + SimHash по content</tspan><tspan x="56" dy="16">• обновить · supersede (мягко) · вставить</tspan><tspan x="56" dy="16">• типизир. связи [[links]] (rel) · ttl (expires_at)</tspan><tspan x="56" dy="16">• индекс: FTS5 всегда; вектор — если есть Embedder</tspan></text>

  <rect x="372" y="292" width="300" height="180" rx="8" fill="#fef3c7" stroke="#f59e0b" filter="url(#sh)"/>
  <text x="384" y="314" font-size="11.5" font-weight="bold" fill="#78350f">Recall · recall — поиск</text>
  <text x="384" y="344" font-size="11" fill="#78350f">• кандидаты: FTS5 (+ морфология RU) + vec<tspan x="384" dy="16">• слияние: Reciprocal Rank Fusion (k ≈ 60)</tspan><tspan x="384" dy="16">• ранжир: relevance · importance · recency · access</tspan><tspan x="384" dy="16">• фильтры: scope · kind · теги · даты · TTL</tspan><tspan x="384" dy="16">• бриф под token_budget · explain · summarize</tspan></text>

  <rect x="704" y="292" width="300" height="180" rx="8" fill="#fce7f3" stroke="#ec4899" filter="url(#sh)"/>
  <text x="716" y="314" font-size="11.5" font-weight="bold" fill="#831843">Maint · maint — фоновые джобы</text>
  <text x="716" y="344" font-size="11" fill="#831843">• expire-sweep: TTL истёк → архив<tspan x="716" dy="16">• decay: старые episodic → вес ↓ → архив</tspan><tspan x="716" dy="16">• dedup-sweep: почти-дубли (SimHash)</tspan><tspan x="716" dy="16">• consolidation: episodic → semantic</tspan><tspan x="716" dy="16">• reindex: при смене Embedder-модели</tspan><tspan x="716" dy="16" fill="#9d174d">по расписанию (scheduler в memoryd)</tspan></text>

  <!-- infra -->
  <rect x="40" y="500" width="215" height="150" rx="8" fill="#ccfbf1" stroke="#0d9488" filter="url(#sh)"/>
  <text x="52" y="520" font-size="10.5" font-weight="bold" fill="#134e4a">Embedder (опц.)</text>
  <text x="52" y="537" font-size="10" fill="#134e4a">ollama · bge-m3<tspan x="52" dy="14">openai · /v1/embeddings</tspan></text>
  <text x="52" y="592" font-size="10" fill="#134e4a">• эмбеддинг: save + запрос<tspan x="52" dy="14">• нет сервиса → recall на FTS5</tspan></text>

  <rect x="300" y="500" width="440" height="150" rx="8" fill="#e2e8f0" stroke="#475569" filter="url(#sh)"/>
  <text x="520" y="522" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">Store — единый файл SQLite</text>
  <text x="520" y="539" text-anchor="middle" font-size="11" fill="#334155">WAL + busy_timeout · метаданные + FTS5 + vec</text>
  <text x="520" y="568" text-anchor="middle" font-size="11" fill="#334155">memories · tags · links</text>
  <text x="520" y="585" text-anchor="middle" font-size="11" fill="#334155">memories_fts (FTS5) · memories_vec (vec0) · embed_meta</text>
  <text x="520" y="614" text-anchor="middle" font-size="10.5" fill="#475569">expires_at · миграции (PRAGMA user_version)</text>
  <text x="520" y="629" text-anchor="middle" font-size="10.5" fill="#475569">superseded_by вместо DELETE</text>

  <rect x="785" y="500" width="215" height="150" rx="8" fill="#cffafe" stroke="#0891b2" filter="url(#sh)"/>
  <text x="797" y="520" font-size="10.5" font-weight="bold" fill="#164e63">Reasoner (опц.)</text>
  <text x="797" y="537" font-size="10" fill="#164e63">DeepSeek chat</text>
  <text x="797" y="578" font-size="10" fill="#164e63">• суммаризация выдачи recall<tspan x="797" dy="14">• консолидация episodic → semantic</tspan><tspan x="797" dy="14">• нет ключа → без LLM-слоя</tspan></text>

  <!-- edges: consumers -> surfaces -->
  <line x1="190" y1="118" x2="190" y2="162" stroke="#475569" stroke-width="1.6" marker-end="url(#aSlate)"/>
  <line x1="522" y1="118" x2="522" y2="162" stroke="#475569" stroke-width="1.6" marker-end="url(#aSlate)"/>
  <line x1="854" y1="118" x2="854" y2="162" stroke="#475569" stroke-width="1.6" marker-end="url(#aSlate)"/>

  <!-- edge: surfaces -> domain -->
  <line x1="520" y1="234" x2="520" y2="260" stroke="#7c3aed" stroke-width="2" marker-end="url(#aPurple)"/>
  <text x="520" y="252" text-anchor="middle" font-size="10" font-weight="bold" fill="#7c3aed">вызовы поверхностей → доменная логика (общая для всех трёх)</text>

  <!-- edges: domain <-> store -->
  <path d="M194,472 L194,486 L366,486 L366,498" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#aSlate)"/>
  <text x="250" y="482" font-size="11" font-weight="bold" fill="#334155">пишет</text>
  <line x1="521" y1="500" x2="521" y2="474" stroke="#475569" stroke-width="2" marker-end="url(#aSlate)"/>
  <text x="528" y="490" font-size="11" font-weight="bold" fill="#334155">читает</text>
  <path d="M854,472 L854,486 L674,486 L674,498" fill="none" stroke="#475569" stroke-width="2" marker-start="url(#aSlateStart)" marker-end="url(#aSlate)"/>
  <text x="700" y="482" font-size="11" font-weight="bold" fill="#334155">обслуживает</text>

  <!-- edges: optional layers (dashed) -->
  <line x1="147" y1="500" x2="147" y2="486" stroke="#0d9488" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aTeal)"/>
  <text x="153" y="497" font-size="9" fill="#0d9488">эмбеддинг</text>
  <line x1="892" y1="500" x2="892" y2="486" stroke="#0891b2" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aCyan)"/>
  <text x="836" y="497" font-size="9" fill="#0891b2">LLM-слой</text>

  <!-- legend -->
  <text x="40" y="678" font-size="10" fill="#374151">→ основной поток (вызов · запись · чтение · обслуживание)      ⇢ опциональный слой: при недоступности деградирует (recall на FTS5, без сводки), а не падает</text>
  <text x="40" y="694" font-size="10" fill="#374151">Одна доменная логика — три поверхности: агенты (MCP stdio) · терминал и хуки (CLI) · человек (Web).      kind: semantic · episodic · procedural      scope: user:* · project:&lt;name&gt; · agent:self</text>
</svg>
