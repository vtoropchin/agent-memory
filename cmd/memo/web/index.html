<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>memo — память агента</title>
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F5F2">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#15171B">
  <link rel="stylesheet" href="/tailwind.css">
</head>
<body>
  <!-- Каркас новой морды (Этап 16, задача 16.2; спецификация design/memo-web-redesign.md).
       Шапка: <h1>, три раздела по хэшу (#/, #/memory, #/board; активный — aria-current),
       единственный на всё приложение селект scope (app.js наполняет его из /api/stats,
       домашний scope помечен по homeScope). Ссылки разделов app.js дописывает текущим
       scope, чтобы он переживал переключение раздела. -->
  <a class="skip" href="#main">К содержимому</a>
  <header class="topbar">
    <h1 class="brand">memo <small id="brand-host">память агента</small></h1>
    <nav class="nav" aria-label="Разделы">
      <a href="#/" data-view="overview">Обзор</a>
      <a href="#/memory" data-view="memory">Память</a>
      <a href="#/board" data-view="board">Доска</a>
    </nav>
    <div class="grow"></div>
    <div class="scopebox">
      <label for="scope-global"><span>Scope</span></label>
      <select id="scope-global" aria-label="Scope записей">
        <option value="">все scope</option>
      </select>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <!-- ошибка API (§5): «Сервер памяти не отвечает» с кнопкой «Повторить» -->
    <div id="notice-root"></div>

    <!-- контейнеры трёх экранов: виден только текущий (hidden снимает app.js);
         заглушки с заголовком — наполнение задачами 16.3 (Обзор), 16.4 (Память),
         16.6 (Доска) -->
    <section id="screen-overview" hidden aria-labelledby="h-overview">
      <h2 id="h-overview" class="sr-only">Обзор</h2>
    </section>
    <section id="screen-memory" hidden aria-labelledby="h-memory">
      <h2 id="h-memory" class="sr-only">Память</h2>
    </section>
    <section id="screen-board" hidden aria-labelledby="h-board">
      <h2 id="h-board">Доска</h2>
      <p class="muted" data-placeholder></p>
    </section>
  </main>

  <!-- панель записи (§2.3, задачи 16.5/16.6): открывается по id= в хэше; role=dialog
       aria-modal, фон под ней inert, Esc закрывает (сначала снимая подтверждение или
       правку), фокус возвращается на открывший элемент -->
  <div id="drawer-root"></div>

  <!-- тосты (§5): один активный, aria-live только здесь и на счётчике результатов -->
  <div id="toast-root" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
