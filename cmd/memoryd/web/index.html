<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentMemory — web-морда</title>
  <link rel="stylesheet" href="/tailwind.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100">
  <div class="mx-auto max-w-5xl px-4 py-6">
    <header>
      <h1 class="text-xl font-semibold">AgentMemory — просмотр памяти</h1>
      <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">просмотр памяти · удаление архивирует запись (soft-delete, история сохраняется)</p>
      <div id="dashboard" class="mt-4"></div>
    </header>

    <section class="mt-6 rounded-lg border border-slate-200 bg-white p-4 dark:border-slate-700 dark:bg-slate-800">
      <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
        <input
          id="search-input"
          type="search"
          placeholder="Поиск по памяти… (Enter или пауза в наборе)"
          class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100"
        >
        <label class="flex shrink-0 items-center gap-2 text-sm">
          <input id="toggle-superseded" type="checkbox">
          показывать архивные
        </label>
        <button id="reset-filters" type="button" class="shrink-0 rounded-md border border-slate-300 px-3 py-2 text-sm hover:bg-slate-100 dark:border-slate-600 dark:hover:bg-slate-700">
          сбросить фильтры
        </button>
      </div>

      <div class="mt-3 grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <div class="text-xs font-semibold uppercase text-slate-500 dark:text-slate-400">kind</div>
          <div id="kind-filters" class="mt-1 flex flex-wrap gap-x-4 gap-y-1"></div>
        </div>
        <div>
          <div class="text-xs font-semibold uppercase text-slate-500 dark:text-slate-400">scope</div>
          <div id="scope-filters" class="mt-1 flex flex-wrap gap-x-4 gap-y-1"></div>
        </div>
      </div>
    </section>

    <section class="mt-4">
      <div class="flex items-center justify-between">
        <div id="results-summary" class="text-sm text-slate-500 dark:text-slate-400"></div>
      </div>
      <div id="cards-container" class="mt-2 space-y-3"></div>
      <div id="pagination" class="mt-4 flex justify-center"></div>
    </section>
  </div>

  <!-- модалка карточки записи -->
  <div id="modal-backdrop" class="hidden fixed inset-0 z-10 flex items-start justify-center overflow-y-auto bg-black/50 p-4 sm:items-center">
    <div class="w-full max-w-2xl rounded-lg bg-white p-5 shadow-lg dark:bg-slate-800">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-semibold">Карточка записи</h2>
        <button id="modal-close" type="button" class="rounded-md px-2 py-1 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700">✕</button>
      </div>
      <div id="modal-content" class="mt-3 max-h-[70vh] overflow-y-auto"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
