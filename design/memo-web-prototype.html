<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>memo — прототип веб-морды</title>
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F5F2">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#15171B">
<meta name="description" content="Дизайн-прототип новой веб-морды memo web: обзор, память, запись, доска, задача. Один файл, данные-заглушки.">
<style>
/* ============================================================
   Design tokens — переносятся в tailwind.input.css как есть
   ============================================================ */
:root{
  color-scheme: light dark;
  /* поверхности */
  --bg:#F5F5F2;          /* страница */
  --surface:#FFFFFF;     /* панели, строки */
  --surface-2:#ECECE8;   /* колонки доски, вторичные области */
  --surface-3:#E3E3DE;   /* hover строки */
  /* текст */
  --ink:#1C1F23;
  --ink-2:#464B53;
  --ink-3:#676C75;       /* ≥ 4.5:1 на surface */
  /* линии */
  --line:#DADBD6;
  --line-strong:#8A8D87;      /* ≥ 3:1 на surface — границы контролов (WCAG 1.4.11) */
  /* акцент и семантика */
  --accent:#2E5BDA;
  --accent-ink:#FFFFFF;
  --accent-soft:#E6ECFB;
  --danger:#B4231F;
  --danger-soft:#FBE7E6;
  --warn:#7A5300;
  --warn-soft:#FBF1DC;
  --ok:#1F6E3A;
  --ok-soft:#E3F2E7;
  /* виды памяти (текст-контраст ≥ 4.5 на surface) */
  --k-semantic:#2F5FB3;
  --k-episodic:#8A5A10;
  --k-procedural:#187066;
  --k-debt:#B3402B;
  --k-task:#6A4FBF;
  /* шрифты */
  --font-ui:-apple-system,"SF Pro Text","Segoe UI",system-ui,Roboto,sans-serif;
  --font-prose:"Iowan Old Style","Charter","Palatino",Georgia,"Times New Roman",serif;
  --font-mono:"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  /* шкала */
  --fs-xs:12px; --fs-sm:13px; --fs-md:14px; --fs-lg:16px; --fs-xl:20px; --fs-2xl:28px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --r:4px; --r-lg:8px;
  --focus:0 0 0 2px var(--surface),0 0 0 4px var(--accent);
  --drawer-w:600px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171B; --surface:#1E2126; --surface-2:#191B1F; --surface-3:#272A30;
    --ink:#E8E9EB; --ink-2:#C0C4CA; --ink-3:#9EA4AD;
    --line:#32363D; --line-strong:#6B7079;
    --accent:#8EA7F2; --accent-ink:#0F172A; --accent-soft:#25304A;
    --danger:#F08C87; --danger-soft:#3B2321;
    --warn:#E9C06A; --warn-soft:#3A2F16;
    --ok:#7FD09A; --ok-soft:#1C3324;
    --k-semantic:#8FB0F0; --k-episodic:#E2B15A; --k-procedural:#6FCABD; --k-debt:#F09480; --k-task:#B9A6F5;
  }
}
:root[data-theme="dark"]{
  --bg:#15171B; --surface:#1E2126; --surface-2:#191B1F; --surface-3:#272A30;
  --ink:#E8E9EB; --ink-2:#C0C4CA; --ink-3:#9EA4AD;
  --line:#32363D; --line-strong:#6B7079;
  --accent:#8EA7F2; --accent-ink:#0F172A; --accent-soft:#25304A;
  --danger:#F08C87; --danger-soft:#3B2321;
  --warn:#E9C06A; --warn-soft:#3A2F16;
  --ok:#7FD09A; --ok-soft:#1C3324;
  --k-semantic:#8FB0F0; --k-episodic:#E2B15A; --k-procedural:#6FCABD; --k-debt:#F09480; --k-task:#B9A6F5;
}

/* ============================================================
   База
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:var(--fs-md)/1.45 var(--font-ui);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--r)}
.skip{position:absolute;left:var(--s3);top:-40px;background:var(--accent);color:var(--accent-ink);padding:6px 10px;border-radius:var(--r);z-index:40}
.skip:focus{top:var(--s3)}
h1,h2,h3{text-wrap:balance}
.num,.n,.when,.rows .sub{display:block;font-size:var(--fs-xs);color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.rows .blk{color:var(--danger);font-weight:600}
.rows .when{font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[hidden]{display:none!important}
code,.mono{font-family:var(--font-mono);font-size:0.92em}
h1,h2,h3{margin:0;font-weight:600;line-height:1.25}
h1{font-size:var(--fs-xl)}
h2{font-size:var(--fs-lg)}
h3{font-size:var(--fs-md)}
p{margin:0}
.muted{color:var(--ink-3)}
.prose{font-family:var(--font-prose);font-size:15.5px;line-height:1.55;max-width:68ch;white-space:pre-wrap;word-wrap:break-word}
.prose code{font-size:0.85em;background:var(--surface-2);padding:0 3px;border-radius:3px}

/* ============================================================
   Каркас: шапка + основная область + панель
   ============================================================ */
.topbar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:var(--s5);padding:0 var(--s5);height:48px}
.brand{font-size:var(--fs-md);font-weight:700;letter-spacing:-0.01em;display:flex;align-items:baseline;gap:var(--s2)}
.brand small{font-weight:400;color:var(--ink-3);font-size:var(--fs-xs)}
.nav{display:flex;gap:var(--s1);height:100%}
.nav button{background:none;border:0;border-bottom:2px solid transparent;padding:0 var(--s3);height:48px;cursor:pointer;color:var(--ink-2)}
.nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.nav button:hover{color:var(--ink)}
.topbar .grow{flex:1}
.scopebox{display:flex;align-items:center;gap:var(--s2);font-size:var(--fs-sm);color:var(--ink-2)}
.scopebox select{max-width:260px}
main{padding:var(--s5);max-width:1400px;margin:0 auto}
main.wide{max-width:none}

/* контролы */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);
  padding:5px 10px;border-radius:var(--r);cursor:pointer;line-height:1.3;color:var(--ink);min-height:30px}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:#fff}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.quiet:hover{background:var(--surface-3);color:var(--ink)}
.btn.sm{padding:2px 8px;min-height:24px;font-size:var(--fs-sm)}
.btn:disabled{opacity:.5;cursor:default}
input[type=search],input[type=text],select,textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:5px 8px;min-height:30px}
input[type=search]{width:100%}
textarea{width:100%;resize:vertical}
select{padding-right:24px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:4px 10px;cursor:pointer;color:var(--ink-2);min-height:28px}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"],.seg button[aria-checked="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.seg button:focus-visible{box-shadow:inset 0 0 0 2px var(--accent);border-radius:0}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:var(--fs-xs);color:var(--ink-2);background:var(--surface)}
.chip.tag{background:var(--surface-2);border-color:transparent}
.chip button{border:0;background:none;padding:0 0 0 2px;cursor:pointer;color:var(--ink-3);line-height:1}
.chip button:hover{color:var(--danger)}

/* вид записи: цветная кромка + слово */
.kind{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);font-weight:600;letter-spacing:.01em}
.kind::before{content:"";width:8px;height:8px;border-radius:2px;background:currentColor}
.kind.semantic{color:var(--k-semantic)}.kind.episodic{color:var(--k-episodic)}.kind.procedural{color:var(--k-procedural)}.kind.debt{color:var(--k-debt)}.kind.task{color:var(--k-task)}
.rule-semantic{border-left-color:var(--k-semantic)}.rule-episodic{border-left-color:var(--k-episodic)}.rule-procedural{border-left-color:var(--k-procedural)}.rule-debt{border-left-color:var(--k-debt)}.rule-task{border-left-color:var(--k-task)}

/* важность: 5 сегментов */
.imp{display:inline-flex;gap:2px;vertical-align:middle}
.imp i{display:block;width:6px;height:10px;border-radius:1px;background:var(--surface);border:1px solid var(--line-strong)}
.imp i.on{background:var(--ink-2);border-color:var(--ink-2)}
.imp.edit i{cursor:pointer;width:10px;height:14px}
.imp.edit i:hover{background:var(--accent)}
.imp-btn{border:0;background:none;padding:0;cursor:pointer}

/* статус задачи */
.status{display:inline-block;font-size:var(--fs-xs);padding:1px 7px;border-radius:3px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.status.doing{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.status.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.status.release,.status.testing,.status.review{border-color:var(--line-strong)}

/* плашки */
.notice{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) var(--s4);border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-size:var(--fs-sm)}
.notice.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.notice.danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.notice.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.notice .grow{flex:1}
.notice .btn{color:inherit;border-color:currentColor;background:transparent}

/* ============================================================
   Обзор
   ============================================================ */
.overview{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(320px,.8fr);gap:var(--s5);align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.panel>header{display:flex;align-items:baseline;gap:var(--s3);padding:var(--s3) var(--s4);border-bottom:1px solid var(--line)}
.panel>header h2{font-size:var(--fs-md)}
.panel>header .muted{font-size:var(--fs-sm)}
.panel>header .grow{flex:1}
.panel .body{padding:var(--s3) var(--s4)}
.stack{display:grid;gap:var(--s5)}
.headline{display:flex;align-items:baseline;gap:var(--s4);flex-wrap:wrap;margin-bottom:var(--s5)}
.headline .num{font-size:var(--fs-2xl);font-weight:600;letter-spacing:-0.02em}
.headline .muted{font-size:var(--fs-sm)}
.kinds{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--s3)}
.kinds button{border:1px solid var(--line);border-left-width:3px;background:var(--surface);border-radius:var(--r);padding:var(--s2) var(--s3);text-align:left;cursor:pointer}
.kinds button:hover{background:var(--surface-3)}
.kinds .n{font-size:var(--fs-xl);font-weight:600;display:block;margin-top:2px}
.kinds .d{font-size:var(--fs-xs);color:var(--ink-3)}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:var(--s3);align-items:baseline;padding:var(--s2) 0;border-top:1px solid var(--line)}
.rows li>.kind,.rows li>.status{justify-self:start}
.rows li>.status{text-align:center;min-width:80px}
.rows li:first-child{border-top:0}
.rows .t{min-width:0}
.rows .t button{border:0;background:none;padding:0;text-align:left;cursor:pointer;color:var(--ink);font:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;display:block}
.rows .t button:hover{color:var(--accent);text-decoration:underline}
.rows .when{font-size:var(--fs-xs);color:var(--ink-3);white-space:nowrap;text-align:right}
.scopes-list{list-style:none;margin:0;padding:0;font-size:var(--fs-sm)}
.scopes-list li{display:flex;justify-content:space-between;padding:3px 0}
.scopes-list button{border:0;background:none;padding:0;cursor:pointer;color:var(--ink);font:inherit}
.scopes-list button:hover{color:var(--accent);text-decoration:underline}
.scopes-list .n{color:var(--ink-3);font-variant-numeric:tabular-nums}
.providers{list-style:none;margin:0;padding:0;font-size:var(--fs-sm)}
.providers li{display:grid;grid-template-columns:10px 1fr;gap:var(--s2);padding:5px 0;align-items:start}
.providers .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--ok)}
.providers .dot.off{background:var(--danger)}
.providers .dot.na{background:var(--line-strong)}
.providers .d{color:var(--ink-3);font-size:var(--fs-xs)}

/* ============================================================
   Память: поиск + фильтры + список
   ============================================================ */
.toolbar{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;margin-bottom:var(--s3)}
.toolbar .search{flex:1;min-width:280px;position:relative}
.toolbar .search input{padding-left:30px}
.toolbar .search svg{position:absolute;left:9px;top:8px;width:14px;height:14px;color:var(--ink-3)}
.filters{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;margin-bottom:var(--s3);font-size:var(--fs-sm)}
.filters label{color:var(--ink-3)}
.filters .checks{display:flex;gap:var(--s2);flex-wrap:wrap}
.filters .checks label{display:inline-flex;align-items:center;gap:4px;color:var(--ink);cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:1px 8px 1px 5px;background:var(--surface)}
.filters .checks label:has(:checked){background:var(--accent-soft);border-color:var(--accent)}
.filters .checks input{margin:0}
.filters .active{margin-left:auto;display:flex;gap:var(--s2);align-items:center;color:var(--ink-3)}
.results-head{display:flex;align-items:baseline;justify-content:space-between;font-size:var(--fs-sm);color:var(--ink-3);margin:var(--s2) 0}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.row{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:var(--s4);padding:var(--s3) var(--s4);border-top:1px solid var(--line);border-left:3px solid transparent;cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-3)}
.row[aria-selected="true"]{background:var(--accent-soft)}
.row:focus-within{background:var(--surface-3)}
.row{scroll-margin-top:56px}
.row .meta{display:flex;flex-direction:column;gap:3px;font-size:var(--fs-xs);color:var(--ink-3)}
.row .meta .scope{color:var(--ink-2);word-break:break-all}
.row .main{min-width:0}
.row .title{border:0;background:none;padding:0;text-align:left;width:100%;cursor:pointer;font-family:var(--font-prose);font-size:15px;line-height:1.4;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .title.archived{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.row .tags{margin-top:5px;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.row .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:var(--fs-xs);color:var(--ink-3);white-space:nowrap}
.row .src{font-size:11px;color:var(--ink-3)}
.empty{padding:var(--s7) var(--s5);text-align:center;color:var(--ink-2)}
.empty h3{margin-bottom:var(--s2)}
.empty p{color:var(--ink-3);max-width:46ch;margin:0 auto var(--s4)}
.hl{background:var(--warn-soft);color:inherit;border-radius:2px}

/* ============================================================
   Панель записи / задачи (drawer)
   ============================================================ */
.drawer-backdrop{position:fixed;inset:0;background:rgba(20,22,26,.25);z-index:9}
.drawer{position:fixed;top:0;right:0;bottom:0;width:var(--drawer-w);max-width:100vw;background:var(--surface);border-left:1px solid var(--line);z-index:10;
  display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,.06)}
/* на широком экране панель у правого края далеко от списка — ставим по центру */
@media (min-width:1200px){
  .drawer{top:40px;bottom:40px;right:auto;left:50%;transform:translateX(-50%);width:720px;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.14)}
  .drawer>header{border-radius:var(--r-lg) var(--r-lg) 0 0}
}
.drawer>header{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.drawer>header .grow{flex:1;min-width:0}
.drawer>.content{flex:1;overflow:auto;overscroll-behavior:contain;padding:var(--s4) var(--s5) var(--s7)}
.drawer .actions{display:flex;gap:var(--s2);padding:var(--s3) var(--s4);border-top:1px solid var(--line);background:var(--surface);align-items:center}
.drawer .actions .grow{flex:1}
.hgroup{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;font-size:var(--fs-sm);color:var(--ink-2);margin-bottom:var(--s4)}
.hgroup .scope{color:var(--ink-3)}
.section{margin-top:var(--s5)}
.section h3{font-size:var(--fs-sm);color:var(--ink-3);font-weight:600;margin-bottom:var(--s2);display:flex;align-items:baseline;gap:var(--s2)}
.section h3 .grow{flex:1}
.summary{font-size:var(--fs-lg);font-family:var(--font-prose);line-height:1.35;margin-bottom:var(--s3)}
.summary.task{font-size:var(--fs-xl);font-family:var(--font-ui);font-weight:600;letter-spacing:-0.01em}
.meta-grid{display:grid;grid-template-columns:max-content 1fr;gap:4px var(--s4);font-size:var(--fs-sm)}
.meta-grid dt{color:var(--ink-3);margin:0}
.meta-grid dd{margin:0;color:var(--ink-2);word-break:break-all}
.links{list-style:none;margin:0;padding:0}
.links li{display:grid;grid-template-columns:110px 1fr auto;gap:var(--s2);align-items:baseline;padding:6px 0;border-top:1px solid var(--line);font-size:var(--fs-sm)}
.links li:first-child{border-top:0}
.links .rel{color:var(--ink-3);font-size:var(--fs-xs)}
.links .rel.in::before{content:"← "}
.links .rel.out::before{content:"→ "}
.links .to{min-width:0}
.links .to button{border:0;background:none;padding:0;text-align:left;cursor:pointer;color:var(--ink);font:inherit}
.links .to button:hover{color:var(--accent);text-decoration:underline}
.links .to .kind{margin-right:6px}
.tags-edit{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tags-edit input{min-height:24px;padding:1px 6px;width:120px;font-size:var(--fs-sm)}
.confirm{margin-top:var(--s3);padding:var(--s3) var(--s4);border:1px solid var(--danger);border-radius:var(--r);background:var(--danger-soft);color:var(--ink)}
.confirm p{margin-bottom:var(--s2);font-size:var(--fs-sm)}
.confirm .btns{display:flex;gap:var(--s2)}
.field{display:grid;gap:4px;font-size:var(--fs-sm);margin-bottom:var(--s3)}
.field label{color:var(--ink-3)}
.fields-2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.progress{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--accent)}
.editing .prose{display:none}
.toast{position:fixed;left:50%;bottom:var(--s5);transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:var(--r);font-size:var(--fs-sm)}

/* ============================================================
   Доска
   ============================================================ */
.board-toolbar{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;margin-bottom:var(--s3);font-size:var(--fs-sm)}
.board-toolbar label{color:var(--ink-3);display:inline-flex;align-items:center;gap:6px}
.board{display:grid;grid-template-columns:repeat(7,minmax(176px,1fr));gap:var(--s3);overflow-x:auto;padding-bottom:var(--s3)}
.col{background:var(--surface-2);border-radius:var(--r-lg);border:1px solid var(--line);display:flex;flex-direction:column;min-height:420px;max-height:calc(100vh - 170px)}
.col>header{display:flex;align-items:baseline;gap:var(--s2);padding:var(--s2) var(--s3);font-size:var(--fs-sm);font-weight:600;border-bottom:1px solid var(--line)}
.col>header .n{color:var(--ink-3);font-weight:400;font-variant-numeric:tabular-nums}
.col>header .grow{flex:1}
.col .cards{flex:1;overflow:auto;padding:var(--s2);display:flex;flex-direction:column;gap:var(--s2)}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.lane{font-size:var(--fs-xs);color:var(--ink-3);padding:6px 4px 2px;border-top:1px solid var(--line);margin-top:4px}
.lane:first-child{border-top:0;margin-top:0}
.card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--k-task);border-radius:var(--r);padding:var(--s2) var(--s3);cursor:grab;position:relative}
.card.epic{border-left-color:var(--ink-2)}
.card.story{border-left-color:var(--line-strong)}
.card:hover{border-color:var(--line-strong)}
.card.dragging{opacity:.5}
body.dragging-any{user-select:none}
.card.blocked{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--surface-2) 6px 7px)}
.card .top{display:flex;align-items:center;gap:6px;font-size:var(--fs-xs);color:var(--ink-3);margin-bottom:4px}
.card .top .grow{flex:1}
.card .ttl{border:0;background:none;padding:0;text-align:left;font:inherit;color:var(--ink);cursor:pointer;line-height:1.35;display:block;width:100%}
.card .ttl:hover{color:var(--accent)}
.card .foot{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:11px;color:var(--ink-3)}
.card .blk{color:var(--danger);font-weight:600}
.card .move{margin-left:auto}
.card .move select{min-height:22px;padding:0 4px;font-size:11px;opacity:0}
.card:hover .move select,.card:focus-within .move select{opacity:1}
.card .prog{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;color:var(--ink-3)}
.card .prog .progress{flex:1;height:4px}
.col .cards .empty{padding:var(--s5) var(--s3);font-size:var(--fs-xs)}

/* ============================================================

.demo{position:fixed;left:var(--s3);bottom:var(--s3);z-index:30;font-size:var(--fs-xs);background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r);padding:6px 10px;color:var(--ink-2);max-width:260px}
.demo summary{cursor:pointer;font-weight:600}
.demo label{display:flex;gap:6px;align-items:center;padding:3px 0;cursor:pointer}
.demo .btn{margin-top:4px}

const KIND_LABEL={semantic:'факт',episodic:'эпизод',procedural:'процедура',debt:'долг',task:'задача'};
const KIND_PLURAL={semantic:'факты',episodic:'эпизоды',procedural:'процедуры',debt:'долг',task:'задачи'};
const KINDS=['semantic','episodic','procedural','debt','task'];
const STATUSES=['backlog','todo','doing','review','testing','release','done'];
const STATUS_LABEL={backlog:'бэклог',todo:'к работе',doing:'в работе',review:'ревью',testing:'проверка',release:'к релизу',done:'готово'};
const TYPE_LABEL={epic:'эпик',story:'история',task:'задача'};
const REL_LABEL={related:'связано',supersedes:'заменяет',causes:'следствие',part_of:'часть',blocked_by:'заблокирована'};

const HOME_SCOPE='project:AgentMemory';

/* ============================================================
   Состояние прототипа
   ============================================================ */
let DB = JSON.parse(JSON.stringify(SEED));
const state = {
  view:'overview',
  scope:HOME_SCOPE,           // глобальный фильтр scope; '' = все
  q:'', mode:'semantic', kinds:new Set(), archived:false,
  board:{type:'', parent:'', tag:'', lanes:true},
  open:null,                  // id открытой записи
  edit:false, confirm:false,
  demo:{embedder:false,reasoner:false,apierror:false,empty:false},
};

/* ============================================================
   Утилиты
   ============================================================ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=id=>DB.find(m=>m.id===id);
function rel(ts){
  if(!ts) return '—';
  const s=NOW-ts; if(s<0){const dd=Math.round(-s/86400);return `через ${dd} ${plural(dd,'день','дня','дней')}`}
  if(s<3600) return `${Math.max(1,Math.round(s/60))} мин назад`;
  if(s<86400) return `${Math.round(s/3600)} ч назад`;
  const dd=Math.round(s/86400); if(dd<30) return `${dd} ${plural(dd,'день','дня','дней')} назад`;
  return new Date(ts*1000).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function fmtDate(ts){const x=new Date(ts*1000);return x.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+x.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
function plural(n,a,b,c){const m=n%10,M=n%100;if(M>=11&&M<=19)return c;if(m===1)return a;if(m>=2&&m<=4)return b;return c}
function fmtN(n){return n.toLocaleString('ru-RU')}
function imp(n,edit,id){let s=`<span class="imp${edit?' edit':''}" role="img" aria-label="важность ${n} из 5">`;for(let i=1;i<=5;i++)s+=`<i class="${i<=n?'on':''}"${edit?` data-imp="${i}" data-id="${id}" role="button" tabindex="0" aria-label="важность ${i}"`:''}></i>`;return s+'</span>'}
function kindTag(k){return `<span class="kind ${k}">${KIND_LABEL[k]}</span>`}
function statusTag(s){return `<span class="status ${s}">${STATUS_LABEL[s]}</span>`}
function tagChips(tags){return tags.map(t=>`<span class="chip tag">${esc(t)}</span>`).join('')}
function scopeShort(s){return s.replace(/^project:/,'')}
function live(m){return !m.supersededBy && !(m.expiresAt && m.expiresAt<NOW)}
function incoming(id){const r=[];DB.forEach(m=>m.links.forEach(l=>{if(l.dst===id)r.push({from:m,rel:l.rel})}));return r}
function blockers(t){return t.links.filter(l=>l.rel==='blocked_by').map(l=>byId(l.dst)).filter(b=>b&&live(b)&&b.status!=='done')}
function parentOf(t){const l=t.links.find(l=>l.rel==='part_of');const p=l&&byId(l.dst);return p&&live(p)?p:null}
function childrenOf(t){return DB.filter(m=>m.kind==='task'&&live(m)&&m.links.some(l=>l.rel==='part_of'&&l.dst===t.id))}
function progressOf(t){const c=childrenOf(t);return c.length?{done:c.filter(x=>x.status==='done').length,total:c.length}:null}
function toast(txt){const r=$('#toast-root');r.innerHTML=`<div class="toast">${esc(txt)}</div>`;clearTimeout(r._t);r._t=setTimeout(()=>r.innerHTML='',2600)}
function inScope(m){return !state.scope||m.scope===state.scope}
function highlight(text,q){if(!q)return esc(text);const words=q.trim().split(/\s+/).filter(w=>w.length>2);let out=esc(text);words.forEach(w=>{out=out.replace(new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark class="hl">$1</mark>')});return out}

/* ============================================================
   Рендер
   ============================================================ */
function render(){
  document.querySelectorAll('.nav button').forEach(b=>b.toggleAttribute('aria-current',false)||b.removeAttribute('aria-current'));
  const cur=document.querySelector(`.nav button[data-nav="${state.view}"]`);cur.setAttribute('aria-current','page');
  const main=$('#main');main.className=state.view==='board'?'wide':'';
  if(state.demo.apierror){main.innerHTML=apiError();return}
  main.innerHTML={overview,memory,board}[state.view]();
  renderScopeSelect();
  renderDrawer();
}
function apiError(){
  return `<div class="notice danger" role="alert"><div class="grow"><strong>Сервер памяти не отвечает.</strong> Запрос к <code>/api/${state.view==='board'?'board':'memories'}</code> завершился ошибкой соединения. Проверь, что <code>memo web</code> запущен на localhost:7070.</div><button class="btn" onclick="render()">Повторить</button></div>`;
}
function renderScopeSelect(){
  const sel=$('#scope-global');const scopes=[...new Set(SEED.map(m=>m.scope))].sort();
  sel.innerHTML=`<option value="">все scope</option>`+scopes.map(s=>`<option value="${esc(s)}"${s===state.scope?' selected':''}>${esc(s)}${s===HOME_SCOPE?' (домашний)':''}</option>`).join('');
}

/* ---------- (а) Обзор ---------- */
function overview(){
  const all=DB.filter(m=>inScope(m)&&!m.supersededBy);
  const archived=DB.filter(m=>inScope(m)&&m.supersededBy).length;
  if(state.demo.empty||!all.length) return emptyMemory();
  const byKind={};KINDS.forEach(k=>byKind[k]=all.filter(m=>m.kind===k).length);
  const recent=all.filter(m=>m.createdAt>d(7)).sort((a,b)=>b.createdAt-a.createdAt);
  const doing=all.filter(m=>m.kind==='task'&&m.status==='doing');
  const review=all.filter(m=>m.kind==='task'&&(m.status==='review'||m.status==='testing'));
  const blocked=all.filter(m=>m.kind==='task'&&m.status!=='done'&&blockers(m).length);
  const expiring=all.filter(m=>m.expiresAt&&m.expiresAt-NOW<14*86400);
  const scopes={};DB.filter(m=>!m.supersededBy).forEach(m=>scopes[m.scope]=(scopes[m.scope]||0)+1);
  const scopeTitle=state.scope?esc(state.scope):'все scope';
  const emb=state.demo.embedder, rsn=state.demo.reasoner;
  return `
  <div class="headline">
    <span class="num">${fmtN(all.length)}</span><span>${plural(all.length,'запись','записи','записей')} в ${scopeTitle}</span>
    <span class="muted">${archived} в архиве · обновлено ${rel(Math.max(...all.map(m=>m.updatedAt)))}</span>
  </div>
  ${emb?`<div class="notice warn" style="margin-bottom:var(--s5)" role="status"><div class="grow"><strong>Поиск по смыслу недоступен.</strong> Эмбеддер ollama/bge-m3 не отвечает — поиск работает только по словам, новые записи копят очередь на эмбеддинг. Сохранение и доска работают как обычно.</div></div>`:''}
  <div class="overview">
    <div class="stack">
      <section class="kinds" aria-label="Записи по видам">
        ${KINDS.map(k=>`<button type="button" class="rule-${k}" data-goto-kind="${k}"><span class="kind ${k}">${KIND_PLURAL[k]}</span><span class="n">${byKind[k]}</span><span class="d">${kindHint(k)}</span></button>`).join('')}
      </section>
      <section class="panel" aria-labelledby="h-recent">
        <header><h2 id="h-recent">Добавлено за 7 дней</h2><span class="muted">${recent.length}</span><span class="grow"></span><button class="btn quiet sm" data-goto="memory">Вся память</button></header>
        <div class="body">${recent.length?`<ul class="rows">${recent.map(m=>`<li>${kindTag(m.kind)}<span class="t"><button type="button" data-open="${m.id}">${esc(m.summary||m.content)}</button></span><span class="when">${rel(m.createdAt)}</span></li>`).join('')}</ul>`:`<p class="muted">За неделю ничего не добавилось. Агент пишет в память по ходу задач — записи появятся здесь.</p>`}</div>
      </section>
      <section class="panel" aria-labelledby="h-doing">
        <header><h2 id="h-doing">На доске</h2><span class="muted">${doing.length} в работе · ${review.length} на ревью и проверке · ${blocked.length} заблокировано</span><span class="grow"></span><button class="btn quiet sm" data-goto="board">Доска</button></header>
        <div class="body">
          <ul class="rows">
            ${[...doing,...review,...blocked].filter((m,i,a)=>a.indexOf(m)===i).map(m=>`<li>${statusTag(m.status)}<span class="t"><button type="button" data-open="${m.id}">${esc(m.summary)}</button>${blockers(m).length?`<span class="sub"><span class="blk">заблокирована</span> · ждёт: ${esc(blockers(m)[0].summary)}</span>`:''}</span><span class="when">${m.branch?`<code>${esc(m.branch)}</code> · `:''}${rel(m.updatedAt)}</span></li>`).join('')}
          </ul>
        </div>
      </section>
    </div>
    <div class="stack">
      <section class="panel" aria-labelledby="h-prov">
        <header><h2 id="h-prov">Сервисы</h2></header>
        <div class="body"><ul class="providers">
          <li><span class="dot"></span><div>Хранилище — PostgreSQL 18, postgres.lan<div class="d">${fmtN(DB.length)} записей всего · схема v4</div></div></li>
          <li><span class="dot${emb?' off':''}"></span><div>Эмбеддер — ollama, bge-m3 (1024)<div class="d">${emb?'не отвечает с 10:40 — поиск только по словам, 3 записи ждут эмбеддинга':'отвечает · очередь на эмбеддинг пуста'}</div></div></li>
          <li><span class="dot${rsn?' off':''}"></span><div>Reasoner — DeepSeek chat<div class="d">${rsn?'нет ключа DEEPSEEK_API_KEY — сводки и консолидация эпизодов выключены':'отвечает · консолидация эпизодов раз в 7 дней'}</div></div></li>
          <li><span class="dot na"></span><div>Фоновые джобы<div class="d">decay · dedup · consolidate · reindex — последний прогон ${rel(h(4))}</div></div></li>
        </ul></div>
      </section>
      ${expiring.length?`<section class="panel" aria-labelledby="h-exp"><header><h2 id="h-exp">Истекает скоро</h2></header><div class="body"><ul class="rows">${expiring.map(m=>`<li>${kindTag(m.kind)}<span class="t"><button type="button" data-open="${m.id}">${esc(m.summary)}</button></span><span class="when">${rel(m.expiresAt)}</span></li>`).join('')}</ul></div></section>`:''}
      <section class="panel" aria-labelledby="h-scopes">
        <header><h2 id="h-scopes">Scope</h2><span class="muted">живые записи</span></header>
        <div class="body"><ul class="scopes-list">${Object.entries(scopes).sort((a,b)=>b[1]-a[1]).map(([s,n])=>`<li><button type="button" data-scope="${esc(s)}">${esc(s)}${s===HOME_SCOPE?' <span class="muted">домашний</span>':''}</button><span class="n">${n}</span></li>`).join('')}</ul></div>
      </section>
    </div>
  </div>`;
}
function kindHint(k){return {semantic:'знания и решения',episodic:'события сессий',procedural:'рецепты',debt:'отложено осознанно',task:'доска'}[k]}
function emptyMemory(){
  return `<div class="panel"><div class="empty"><h3>В ${state.scope?esc(state.scope):'памяти'} пока ничего нет</h3><p>Агент пишет сюда по ходу задач через <code>memory_save</code>. Подключи MCP-сервер memo к проекту — первые записи появятся после первой сессии.</p><button class="btn" data-scope="">Показать все scope</button></div></div>`;
}

/* ---------- (б) Память: список + поиск ---------- */
function filtered(){
  let items=DB.filter(inScope);
  if(!state.archived) items=items.filter(m=>!m.supersededBy);
  if(state.kinds.size) items=items.filter(m=>state.kinds.has(m.kind));
  if(state.q.trim()){
    const q=state.q.toLowerCase().split(/\s+/).filter(Boolean);
    items=items.map(m=>{const hay=(m.content+' '+(m.summary||'')+' '+m.tags.join(' ')).toLowerCase();
      const hits=q.filter(w=>hay.includes(w)).length;
      const lexical=hits>0, vector=!state.demo.embedder&&state.mode==='semantic'&&m.importance>=3&&hits>0;
      return {m,score:hits/q.length*(0.6+m.importance*0.08),source:lexical&&vector?'lexical+vector':lexical?'lexical':'',hits}})
      .filter(x=>x.hits).sort((a,b)=>b.score-a.score).map(x=>Object.assign({},x.m,{_score:x.score,_source:x.source}));
  } else items=items.slice().sort((a,b)=>b.createdAt-a.createdAt);

}

/* ---------- (г) Доска ---------- */
function boardTasks(){
  return DB.filter(m=>m.kind==='task'&&live(m)&&inScope(m)&&(!state.board.type||m.type===state.board.type)&&(!state.board.tag||m.tags.includes(state.board.tag))&&(!state.board.parent||(parentOf(m)&&parentOf(m).id===state.board.parent)));
}
function board(){

  const blockedN=tasks.filter(t=>blockers(t).length&&t.status!=='done').length;

  <div class="board-toolbar">
    <label>Тип <select id="b-type"><option value="">любой</option>${Object.entries(TYPE_LABEL).map(([k,v])=>`<option value="${k}"${state.board.type===k?' selected':''}>${v}</option>`).join('')}</select></label>

    <span class="muted" style="margin-left:auto">${tasks.length} ${plural(tasks.length,'задача','задачи','задач')}${blockedN?` · ${blockedN} заблокировано`:''}${state.scope?` · ${esc(scopeShort(state.scope))}`:' · все scope'}</span>
    ${(state.board.type||state.board.parent||state.board.tag)?`<button class="btn quiet sm" id="b-reset">Сбросить</button>`:''}
  </div>

function column(s,cards){
  const groups={};
  if(state.board.lanes){cards.forEach(c=>{const p=parentOf(c);const key=p?p.id:'';(groups[key]=groups[key]||[]).push(c)})}else groups['']=cards;
  const keys=Object.keys(groups).sort((a,b)=>(a===''?1:0)-(b===''?1:0));
  return `<section class="col" data-status="${s}" role="listitem" aria-labelledby="col-${s}">
    <header><span id="col-${s}">${STATUS_LABEL[s]}</span><span class="n">${cards.length}</span><span class="grow"></span>${s==='done'?`<span class="n">30 последних</span>`:''}</header>
    <div class="cards">
      ${cards.length?keys.map(k=>`${state.board.lanes&&keys.length>1?`<div class="lane">${k?'↳ '+esc(byId(k).summary):'без родителя'}</div>`:''}${groups[k].map(card).join('')}`).join(''):`<div class="empty">${s==='doing'?'Ничего не в работе':'Пусто'}</div>`}
    </div>

function card(t){

  <div class="section"><h3>Теги</h3>${tagsEditor(t)}</div>
  <div class="section"><h3>Служебное</h3><dl class="meta-grid"><dt>id</dt><dd><code>${t.id}</code></dd><dt>scope</dt><dd>${esc(t.scope)}</dd><dt>создана</dt><dd>${fmtDate(t.createdAt)}</dd><dt>изменена</dt><dd>${fmtDate(t.updatedAt)}</dd></dl></div>
  ${state.confirm?forgetConfirm(t):''}`;
}

/* ============================================================
   Действия (в реальном приложении — вызовы API, здесь правят DB)
   ============================================================ */
function openRec(id){lastFocus=document.activeElement;state.open=id;state.edit=false;state.confirm=false;render();setTimeout(()=>$('.drawer header [aria-label="Закрыть панель"]')?.focus(),30)}
function closeRec(){state.open=null;state.edit=false;state.confirm=false;render();lastFocus?.focus?.()}
function patch(id,fields){const m=byId(id);if(!m)return;
  if(fields.status&&fields.status!==m.status){const order=STATUSES.indexOf(fields.status);if(order>1&&blockers(m).length){toast(`Не переведена: «${m.summary.slice(0,40)}…» заблокирована — ${blockers(m).map(b=>b.summary.slice(0,30)+'…').join(', ')}`);render();return false}}
  Object.assign(m,fields,{updatedAt:NOW});render();return true}
function forget(id){const m=byId(id);m.supersededBy=m.id;m.updatedAt=NOW;state.confirm=false;state.open=null;render();toast(`Забыта: «${(m.summary||m.content).slice(0,50)}…» — в архиве`)}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-nav],[data-goto],[data-goto-kind],[data-open],[data-close],[data-scope],[data-mode],[data-edit],[data-cancel],[data-save],[data-forget-ask],[data-forget-cancel],[data-forget],[data-untag],[data-unlink],[data-imp],#reset,#b-reset');
  if(!t)return;
  if(t.dataset.nav){state.view=t.dataset.nav;render();return}
  if(t.dataset.goto){state.view=t.dataset.goto;if(t.hasAttribute('data-close'))state.open=null;render();return}
  if(t.dataset.gotoKind){state.view='memory';state.kinds=new Set([t.dataset.gotoKind]);state.q='';render();return}
  if(t.dataset.open!==undefined&&t.dataset.open){openRec(t.dataset.open);return}
  if(t.hasAttribute('data-close')){closeRec();return}
  if(t.dataset.scope!==undefined){state.scope=t.dataset.scope;if(state.view==='overview'&&t.dataset.scope!=='')state.view='memory';render();return}
  if(t.dataset.mode){state.mode=t.dataset.mode;render();$('#q')?.focus();return}
  if(t.id==='reset'){state.kinds.clear();state.archived=false;state.q='';state.scope='';render();$('#q')?.focus();return}
  if(t.id==='b-reset'){state.board={type:'',parent:'',tag:'',lanes:state.board.lanes};render();return}
  if(t.dataset.edit!==undefined){state.edit=true;state.confirm=false;render();$('#ed-content')?.focus();return}
  if(t.dataset.cancel!==undefined){state.edit=false;render();return}
  if(t.dataset.save!==undefined){const m=byId(state.open);const s=$('#ed-summary'),c=$('#ed-content');if(s)m.summary=s.value.trim()||null;if(c)m.content=c.value;m.updatedAt=NOW;state.edit=false;render();toast('Сохранено');return}
  if(t.dataset.forgetAsk!==undefined){state.confirm=true;render();$('.confirm [data-forget]')?.focus();return}
  if(t.dataset.forgetCancel!==undefined){state.confirm=false;render();$('[data-forget-ask]')?.focus();return}
  if(t.dataset.forget){forget(t.dataset.forget);return}
  if(t.dataset.untag){const m=byId(t.closest('[data-tags]').dataset.tags);m.tags=m.tags.filter(x=>x!==t.dataset.untag);m.updatedAt=NOW;render();toast(`Тег «${t.dataset.untag}» снят`);return}
  if(t.dataset.unlink){const m=byId(t.dataset.id);m.links=m.links.filter(l=>!(l.dst===t.dataset.unlink&&l.rel===t.dataset.rel));m.updatedAt=NOW;render();toast(t.dataset.rel==='blocked_by'?'Блокировка снята':'Отвязано');return}
  if(t.dataset.imp){const m=byId(t.dataset.id);m.importance=+t.dataset.imp;m.updatedAt=NOW;render();toast(`Важность ${m.importance} из 5`);return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&state.open){if(state.confirm){state.confirm=false;render()}else closeRec();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-imp]')){e.preventDefault();e.target.click();return}
  if(e.key==='Enter'&&e.target.matches('[data-newtag]')){const m=byId(e.target.dataset.newtag);const v=e.target.value.trim().toLowerCase();if(v&&!m.tags.includes(v)){m.tags.push(v);m.tags.sort();m.updatedAt=NOW;render();$(`[data-newtag="${m.id}"]`)?.focus();toast(`Тег «${v}» добавлен`)}e.preventDefault();return}
  if(e.key==='/'&&!e.target.matches('input,textarea,select')){e.preventDefault();if(state.view!=='memory'){state.view='memory';render()}$('#q')?.focus()}
});
let qTimer;
document.addEventListener('input',e=>{
  if(e.target.id==='q'){clearTimeout(qTimer);const v=e.target.value;qTimer=setTimeout(()=>{state.q=v;render();const i=$('#q');i.focus();i.setSelectionRange(v.length,v.length)},260)}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='scope-global'){state.scope=t.value;render();return}
  if(t.dataset.kind){t.checked?state.kinds.add(t.dataset.kind):state.kinds.delete(t.dataset.kind);render();return}
  if(t.id==='archived'){state.archived=t.checked;render();return}
  if(t.id==='b-type'){state.board.type=t.value;render();return}
  if(t.id==='b-parent'){state.board.parent=t.value;render();return}
  if(t.id==='b-tag'){state.board.tag=t.value;render();return}
  if(t.id==='b-lanes'){state.board.lanes=t.checked;render();return}
  if(t.dataset.move){const ok=patch(t.dataset.move,{status:t.value});if(ok)toast(`Перенесена в «${STATUS_LABEL[t.value]}»`);return}
  if(t.dataset.field){const ok=patch(t.dataset.id,{[t.dataset.field]:t.value});if(ok&&t.dataset.field==='status')toast(`Стадия: ${STATUS_LABEL[t.value]}`);return}
  if(t.id==='demo-embedder'){state.demo.embedder=t.checked;render();return}
  if(t.id==='demo-reasoner'){state.demo.reasoner=t.checked;render();return}
  if(t.id==='demo-apierror'){state.demo.apierror=t.checked;render();return}
  if(t.id==='demo-empty'){state.demo.empty=t.checked;render();return}
  if(t.id==='demo-dark'){document.documentElement.dataset.theme=t.checked?'dark':'light';return}
});
$('#demo-reset').addEventListener('click',()=>{DB=JSON.parse(JSON.stringify(SEED));state.open=null;render();toast('Правки макета сброшены')});

/* drag & drop на доске (мышь); клавиатурная альтернатива — select «Переместить» и поле «Стадия» в панели */
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest('.card');if(!c)return;dragId=c.dataset.id;c.classList.add('dragging');document.body.classList.add('dragging-any');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)});
document.addEventListener('dragend',e=>{document.body.classList.remove('dragging-any');e.target.closest?.('.card')?.classList.remove('dragging');document.querySelectorAll('.col.over').forEach(c=>c.classList.remove('over'))});
document.addEventListener('dragover',e=>{const col=e.target.closest('.col');if(!col)return;e.preventDefault();document.querySelectorAll('.col.over').forEach(c=>c!==col&&c.classList.remove('over'));col.classList.add('over')});
document.addEventListener('dragleave',e=>{const col=e.target.closest('.col');if(col&&!col.contains(e.relatedTarget))col.classList.remove('over')});
document.addEventListener('drop',e=>{const col=e.target.closest('.col');if(!col||!dragId)return;e.preventDefault();const s=col.dataset.status;const t=byId(dragId);if(t.status!==s){if(patch(dragId,{status:s}))toast(`«${t.summary.slice(0,40)}…» → ${STATUS_LABEL[s]}`)}dragId=null});

render();
</script>

<!--
============================================================================
ЗАМЕТКИ ДЛЯ РЕАЛИЗАЦИИ (по итогам макета)
============================================================================

Реализуется поверх существующего API без изменений:
- Обзор: счётчики по видам/scope — GET /api/stats (byKind, byScope, homeScope);
  «Добавлено за 7 дней» — GET /api/memories?scope=…&limit=10 (ULID сортирует по
  времени, отсечь по createdAt на клиенте); «На доске» — GET /api/board?scope=…
  и фильтр по колонкам doing/review/testing + blocked на клиенте.
- Память: список — GET /api/memories?scope&kind&superseded=1&limit&offset;
  поиск — GET /api/search?q&mode&kind&scope; плашка деградации — по флагу
  vector:false в ответе; подпись «слова + смысл» — из source кандидата.
- Запись: GET /api/memories/{id} (neighbors по графу, semanticNeighbors,
  embedding, blockedBy/blocks/parent/children/progress); важность и теги —
  PATCH {importance} / {tags:[…]} (заменяющая семантика тегов, как сейчас);
  «Забыть» — DELETE /api/memories/{id}; входящие связи — из neighbors (у DTO
  записи есть только исходящие links, направление берётся по тому, у кого dst).
- Задача: стадия/тип/ветка/процесс — PATCH {status|type|branch|workflow};
  снять блокер/родителя — PATCH {unlinks:[{id,rel}]}; добавить — PATCH
  {links:[…]} с пикером через GET /api/search?q&mode=lexical&kind=task.
  409 с blockers — тост + откат, как в макете (patch() имитирует 409).
- Глобальный селект scope — один параметр scope на все три экрана; на доске
  он же вместо отдельного селекта «проект».

Потребует новых полей/эндпоинтов (или решения):
1. Состояние сервисов на обзоре (store/embedder/reasoner: provider, model,
   available, очередь на эмбеддинг, время последнего прогона джобов) — нового
   поля providers/jobs в GET /api/stats сейчас нет; до него плашку деградации
   можно показать только после первого /api/search (vector:false). Задача
   заведена в заглушках доски как «Состояние провайдеров в /api/stats».
2. Правка текста и summary из браузера («Изменить» в панели записи) —
   противоречит инварианту DESIGN §12 «content/summary из браузера не
   редактируются никогда». В макете кнопка оставлена, потому что сценарий 3
   ТЗ прямо требует «правлю текст». Решение нужно до реализации: либо снять
   инвариант (PATCH принимает content/summary → Writer.Update с переэмбеддингом),
   либо оставить только importance/теги и убрать «Изменить». Рекомендация:
   снять инвариант для content/summary — правка одним пользователем локально
   безопаснее, чем обходной путь через MCP ради опечатки.
3. «Истекает скоро» на обзоре — нужен фильтр expiresBefore в GET /api/memories
   (или клиентская выборка последних N с проверкой expiresAt — дорого).
4. «Похожие по вектору» показывают расстояние (есть в semanticNeighbors) —
   без изменений; но «в очереди на эмбеддинг» для свежей записи —
   embedding.embedded=false, уже есть.
5. Счётчик «читалась N раз» — accessCount/accessedAt уже в DTO.

Решения, принятые в макете (и почему):
- Панель справа вместо модалки: правка/забывание не покидает список или
  доску; переход по связи открывает следующую запись в той же панели.
- Один глобальный scope в шапке вместо чекбоксов на 20 проектов и отдельного
  селекта на доске: «фильтр по scope виден и сбрасывается одним действием».
- Фильтр вида — пять чекбоксов-чипов, не пять кнопок-счётчиков: multiselect
  нужен (например, «долг + задачи»).
- Важность — 5 сегментов вместо звёзд: читается как шкала, кликается как
  контрол; звёзды на доске давали визуальный шум в каждой карточке.
- Drag&drop оставлен, доступная альтернатива — select «Переместить» в футере
  карточки (виден при hover/focus) и поле «Стадия» в панели; всё это один и
  тот же PATCH {status}.
- Свимлейны по родителю включены по умолчанию — колонка doing с эпиком и его
  подзадачами вперемешку читается хуже.
- Подтверждение «Забыть» — инлайн в панели, не отдельный диалог: одно
  действие, одна поверхность; текст говорит, что именно произойдёт (архив,
  выпадет из recall, связи сохранятся).
- Тёмная тема — через те же токены под prefers-color-scheme; служебный
  переключатель в панели макета только для просмотра.
-->
</body>
</html>
