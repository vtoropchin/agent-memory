# Пример конфигурации Agent Memo (DESIGN.md §13).
#
# Скопируйте файл (например, в ~/.agentmemory/config.toml) и передайте путь через
# флаг `-config` при запуске memo. Если конфиг не передан или каких-то полей в
# нём нет — используются дефолты из internal/config.Default() (эквивалентны Этапу 1:
# reasoner и embedder выключены, только SQLite FTS5).

[store]
# driver — бэкенд хранилища: sqlite (дефолт, локальный файл) | postgres (общий
# сервер для команды, DESIGN.md §2.1/§13). Пустое значение = sqlite — старые
# конфиги без этого поля продолжают работать без единой правки.
driver = "sqlite"
# Путь к файлу SQLite (~ раскрывается в домашний каталог пользователя).
path = "~/.agentmemory/memory.db"
#
# Альтернатива — postgres (закомментировано; одна активная секция [store] на
# конфиг, вторую нужно раскомментировать вместо секции выше):
# [store]
# driver  = "postgres"
# host    = "postgres.lan"
# port    = 5432                             # дефолт 5432, если не задан
# user    = "memo"
# dbname  = "memo"
# sslmode = "disable"                        # дефолт "disable", если не задан
# # Пароль в этот файл НЕ пишется — читается из env MEMO_POSTGRES_PASSWORD (или
# # .env рядом с этим конфигом), то же правило, что для DEEPSEEK_API_KEY/
# # OPENAI_API_KEY выше. Пустой пароль — не ошибка (сервер может использовать
# # trust-аутентификацию): memo предупредит в stderr и всё равно попробует
# # подключиться (деградация, а не падение на старте, DESIGN.md §15).

[embedder]
# noop    — векторный слой выключен, поиск только по FTS5 (дефолт, Этап 1).
# ollama  — локальный сервер Ollama, модель эмбеддингов задаётся полем model.
# openai  — совместимый с OpenAI API эмбеддер (ключ читается из env, не отсюда).
provider = "ollama"
base_url = "http://localhost:11434"
model    = "bge-m3"                        # любая ollama-модель; dim определяется автоматически
# При старте memo делает пробный эмбеддинг, чтобы проверить доступность сервера
# и модели — dim не хардкодится и не задаётся здесь. Если ollama недоступен или
# модель не подтянута, memo всё равно стартует: предупреждение в stderr и откат
# на noop (recall на чистом FTS5, DESIGN.md §15). Отложенные вектора досчитываются
# в фоне при следующем запуске с рабочим ollama (internal/memory/maint.Reindexer).
#
# Альтернатива — openai (закомментировано, включает одна раскомментированная секция
# [embedder] выше эту секцию заменяет, TOML не позволяет две активные секции с
# одинаковым именем):
# [embedder]
# provider = "openai"
# base_url = "https://api.openai.com"        # пусто = дефолт api.openai.com; также
#                                             # подходит любой /v1/embeddings-совместимый
#                                             # сервер — OpenRouter, LM Studio, vLLM
# model    = "text-embedding-3-small"         # любая совместимая модель; dim определяется автоматически
# # Ключ берётся ТОЛЬКО из env OPENAI_API_KEY (или .env рядом с этим конфигом), в этот
# # файл не пишется — то же правило, что для DEEPSEEK_API_KEY. Пустой ключ или ошибка
# # обращения к серверу — предупреждение в stderr и откат на noop (recall на FTS5).
#
# Смена провайдера (ollama → openai или наоборот) не требует ручных действий сверх
# правки этой секции: embed_meta хранит текущую model+dim, и Reindexer при
# несовпадении сам пересоздаёт vec-таблицу и перегоняет записи новой моделью.
#
# Альтернатива — noop (закомментировано, без вектора вовсе — тот же noop, что
# используется автоматически, когда конфиг-файл вообще не передан):
# [embedder]
# provider = "noop"

[reasoner]
# noop     — без LLM: recall возвращает сырые карточки без суммаризации, консолидация
#            episodic→semantic недоступна (дефолт, Этап 1).
# deepseek — DeepSeek chat (OpenAI-совместимый API). Ключ берётся из env
#            DEEPSEEK_API_KEY, а не из этого файла. Если в shell-env его нет,
#            memo сам подхватывает его из .env рядом с этим конфигом при
#            старте (DESIGN.md §13; раскладывается `memo init`, задача 5.4).
#            Если ключ всё равно пуст, memo стартует с предупреждением и
#            работает как noop (деградация, DESIGN §15).
# cliproxy — локальный CLIProxyAPI (OpenAI-совместимый прокси к Gemini/Claude/
#            Codex по подписке). Ключ — один из api-keys его конфига — в env
#            CLIPROXY_API_KEY (или .env), модель обязательна: список —
#            GET <base_url>/models. base_url по умолчанию http://127.0.0.1:8317/v1.
# base_url — опционально у любого провайдера; пусто = дефолт провайдера.
provider = "deepseek"
model    = "deepseek-chat"
#
# Альтернатива — noop (закомментировано, без LLM явно — эквивалентно дефолту
# при отсутствии этой секции):
# [reasoner]
# provider = "noop"
#
# Альтернатива — CLIProxyAPI:
# [reasoner]
# provider = "cliproxy"
# base_url = "http://127.0.0.1:8317/v1"
# model    = "gemini-3-flash"

[recall]
default_token_budget = 800
weights = { relevance = 1.0, importance = 0.5, recency = 0.4, access = 0.2 }
# debt_weight — понижающий множитель итогового скора записей kind=debt (техдолг):
# долг участвует в дефолтной выдаче recall наравне с остальными записями, но не
# должен вытеснять факты из бюджета токенов. Не задано (0) = дефолт 0.6; явное
# значение вне (0, 1] — ошибка конфигурации.
debt_weight = 0.6

[maint]
decay_interval    = "24h"
consolidate_after = "168h"                 # неделя episodic → semantic

[scope]
# Мультипроектность (DESIGN.md §2.1): один общий файл БД, изоляция через scope.
# Каждый проект запускает свой memo (через .mcp.json в репозитории) со своим
# project — отсюда выводится "домашнее" пространство "project:<name>".
#
# project — имя текущего проекта. Пусто (дефолт) — мультипроектность выключена:
#           memory_save требует явный scope в каждом вызове, memory_recall без
#           scope/scopes ищет по всей базе без фильтра (одно-проектный/adhoc-режим).
project = "agentmemory"
# shared — пространства, всегда добавляемые к recall по умолчанию поверх
#          "домашнего" project:<name> (общий пользовательский слой поверх проектов).
shared  = ["user:*"]
